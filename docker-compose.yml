services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-repo_research}
      POSTGRES_USER: ${POSTGRES_USER:-repo_research}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repo_research}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-repo_research} -d ${POSTGRES_DB:-repo_research}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local  # Load secrets from .env.local instead of .env
    environment:
      RDR_QDRANT_URL: http://qdrant:6333
      RDR_POSTGRES_DSN: postgresql://${POSTGRES_USER:-repo_research}:${POSTGRES_PASSWORD:-repo_research}@postgres:5432/${POSTGRES_DB:-repo_research}
      RDR_TELEMETRY_ENABLED: "true"
      RDR_CORS_ALLOWED_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      RDR_REPOSITORY_ROOT: /repository
    volumes:
      - ${REPOSITORY_PATH:-.}:/repository:ro
      - fastembed_cache:/root/.cache/fastembed
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_storage:
  qdrant_storage:
  fastembed_cache:
