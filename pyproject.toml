[project]
name = "repo-deep-research"
version = "0.5.8"
description = "Evidence-grounded research for Python repositories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.140.7",
    "fastembed==0.7.3",
    "openai==2.48.0",
    "pathspec==0.12.1",
    "psycopg[binary]==3.3.2",
    "pydantic-ai==2.22.0",
    "pydantic-settings==2.10.1",
    "qdrant-client==1.15.1",
    "uvicorn==0.51.0",
]

[project.scripts]
repo-research = "repo_research.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_research"]

[dependency-groups]
dev = [
    "anyio==4.14.2",
    "httpx==0.28.1",
    "mypy==1.17.1",
    "pytest==8.4.1",
    "pytest-cov==7.0.0",
    "ruff==0.12.10",
]

[tool.coverage.run]
branch = true
source = ["repo_research"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["repo_research"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
